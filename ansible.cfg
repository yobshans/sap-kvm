[defaults]
roles_path = .
inventory = inventory_vm.ini
host_key_checking = False
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections

[ssh_connection]
# Run each module in a single SSH round-trip instead of transferring a temp
# file first. This is the big win for the slurp loops in topology.yml, which
# otherwise pay full SSH overhead per file (one call per NUMA node and per CPU).
pipelining = True
# Reuse one SSH connection across all those calls.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s


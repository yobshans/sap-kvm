---
# ============================================================================
# Preflight — validate host is KVM-capable and has required resources
# ============================================================================

- name: Ensure required packages are installed
  ansible.builtin.dnf:
    name:
      - qemu-kvm
      - libvirt
      - nftables
      - python3
      - python3-libvirt
      - python3-lxml
      - numactl
      - sshpass
      - python3-pip
      - python3-packaging
      - pciutils
    state: present

- name: Ensure pycdlib for cloud-init ISO creation
  block:
    - name: Install pycdlib from RPM
      ansible.builtin.dnf:
        name: python3-pycdlib
        state: present
  rescue:
    - name: Install pycdlib with pip
      ansible.builtin.pip:
        name: pycdlib

- name: Check KVM device
  ansible.builtin.stat:
    path: /dev/kvm
  register: kvm_dev

- name: Validate KVM host
  ansible.builtin.assert:
    that:
      - kvm_dev.stat.exists
      - ansible_virtualization_role | default('host') != 'guest' or kvm_dev.stat.exists
    fail_msg: "/dev/kvm is missing; this host cannot run KVM guests"
    success_msg: "KVM device /dev/kvm is present"

- name: Display host CPU facts
  ansible.builtin.debug:
    msg:
      - "Model: {{ ansible_processor[2] | default(ansible_processor[-1]) }}"
      - "vCPUs: {{ ansible_processor_vcpus }}"
      - "Cores: {{ ansible_processor_cores }}"
      - "Sockets: {{ ansible_processor_count }}"

- name: Display host memory facts
  ansible.builtin.debug:
    msg:
      - "MemTotal: {{ ansible_memtotal_mb }} MiB"
      - "MemFree: {{ ansible_memfree_mb }} MiB"

- name: Ensure libvirtd is running
  ansible.builtin.systemd:
    name: libvirtd
    state: started
    enabled: true

- name: Ensure default network is active
  community.libvirt.virt_net:
    name: "{{ vm_network }}"
    state: active

- name: Autostart default network
  community.libvirt.virt_net:
    name: "{{ vm_network }}"
    autostart: true

# Some hosts have a host-level firewall (iptables-nft/nftables) with a
# catch-all REJECT at the end of INPUT that pre-dates libvirt's own network,
# and it can shadow dnsmasq's DHCP/DNS sockets on the bridge even though the
# libvirt network itself is "active". Guests then boot fine, request DHCP
# forever, and never get a lease. Resolve the network's real bridge device
# and make sure traffic from it is accepted before that catch-all rule.
- name: Read guest network XML to find its bridge device
  community.libvirt.virt_net:
    command: get_xml
    name: "{{ vm_network }}"
  register: vm_network_xml

- name: Determine the bridge interface for the guest network
  # regex_search always returns a list when given a backreference arg, even
  # for a single group (['virbr0'], not 'virbr0') -- index into it or the
  # rendered iptables rule ends up matching a literal "['virbr0']" interface
  # name, i.e. nothing, and traffic silently falls through to any catch-all
  # reject rule further down the chain.
  ansible.builtin.set_fact:
    vm_network_bridge_iface: "{{ (vm_network_xml.get_xml | regex_search('<bridge[^>]*name=.([a-zA-Z0-9_]+)', '\\1') | default([''], true))[0] }}"

- name: Fail if the guest network bridge device could not be determined
  ansible.builtin.fail:
    msg: >-
      Could not find a <bridge name='...'/> device in the XML for libvirt
      network '{{ vm_network }}'. It may be an isolated/routed network with
      no bridge, which this role does not support.
  when: not (vm_network_bridge_iface | default('') | length > 0)

# Manage the host firewall with nftables directly. Some RHEL 10 hosts use
# nftables with a catch-all REJECT in INPUT/FORWARD that shadows dnsmasq on
# the libvirt bridge. Direct `nft insert` + string matching was too fragile
# (rules silently missing → guest NIC up, zero DHCP leases). Insert at the
# head of each chain when absent, then re-list and FAIL if the bridge still
# isn't accepted — never continue toward vm_define with a broken firewall.
- name: Ensure nftables allows DHCP/DNS/NAT for the guest bridge
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      bridge='{{ vm_network_bridge_iface }}'

      if ! nft list chain ip filter INPUT >/dev/null 2>&1; then
          echo "nftables chain 'ip filter INPUT' is missing" >&2
          exit 1
      fi
      if ! nft list chain ip filter FORWARD >/dev/null 2>&1; then
          echo "nftables chain 'ip filter FORWARD' is missing" >&2
          exit 1
      fi

      input_before="$(nft list chain ip filter INPUT)"
      forward_before="$(nft list chain ip filter FORWARD)"
      changed=0

      # Match the bridge name only — nft may render counters between the
      # match and the verdict, so do not require an exact full-rule string.
      if ! grep -E "iifname \"${bridge}\".*udp dport.*(53|67)" <<<"${input_before}" \
            | grep -Eq 'accept'; then
          nft insert rule ip filter INPUT iifname "${bridge}" udp dport '{ 53, 67 }' accept
          changed=1
      fi

      if ! grep -E "iifname \"${bridge}\".*tcp dport.*53" <<<"${input_before}" \
            | grep -Eq 'accept'; then
          nft insert rule ip filter INPUT iifname "${bridge}" tcp dport 53 accept
          changed=1
      fi

      if ! grep -Eq 'ct state (established,related|related,established).*accept' \
            <<<"${forward_before}"; then
          nft insert rule ip filter FORWARD ct state established,related accept
          changed=1
      fi

      if ! grep -E "iifname \"${bridge}\"" <<<"${forward_before}" \
            | grep -Eq 'accept'; then
          nft insert rule ip filter FORWARD iifname "${bridge}" accept
          changed=1
      fi

      input_after="$(nft list chain ip filter INPUT)"
      forward_after="$(nft list chain ip filter FORWARD)"

      if ! grep -E "iifname \"${bridge}\".*udp dport.*(53|67)" <<<"${input_after}" \
            | grep -Eq 'accept'; then
          echo "FAILED: DHCP/DNS udp accept for ${bridge} still missing in INPUT:" >&2
          echo "${input_after}" >&2
          exit 1
      fi
      if ! grep -E "iifname \"${bridge}\".*tcp dport.*53" <<<"${input_after}" \
            | grep -Eq 'accept'; then
          echo "FAILED: DNS tcp accept for ${bridge} still missing in INPUT:" >&2
          echo "${input_after}" >&2
          exit 1
      fi
      if ! grep -E "iifname \"${bridge}\"" <<<"${forward_after}" \
            | grep -Eq 'accept'; then
          echo "FAILED: outbound accept for ${bridge} still missing in FORWARD:" >&2
          echo "${forward_after}" >&2
          exit 1
      fi

      echo "nftables guest-bridge rules ok for ${bridge} (changed=${changed})"
      exit 0
  register: _nft_guest_bridge_rules
  changed_when: "'changed=1' in _nft_guest_bridge_rules.stdout"

- name: Show nftables guest-bridge firewall status
  ansible.builtin.debug:
    msg: "{{ _nft_guest_bridge_rules.stdout }}"

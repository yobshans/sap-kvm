---
# Manage /etc/hosts for this guest (hypervisor or the guest itself).
# One plain line, no BEGIN/END markers. Strips FQDN/hostname from 127.0.0.1
# so sap_maintain_etc_hosts does not see hostname -> 127.0.0.1.

- name: Remove sap_vm marker comments from /etc/hosts
  ansible.builtin.replace:
    path: /etc/hosts
    regexp: '(?m)^# (BEGIN|END) sap_vm {{ vm_name | regex_escape }}\s*\n'
    replace: ""

- name: Remove complete guest hostname lines from /etc/hosts
  ansible.builtin.replace:
    path: /etc/hosts
    regexp: '(?m)^[0-9a-fA-F:.]+\s+{{ vm_fqdn | regex_escape }}(\s+{{ vm_hostname | regex_escape }})?\s*(\n|$)'
    replace: ""

- name: Strip guest FQDN from other /etc/hosts lines
  ansible.builtin.replace:
    path: /etc/hosts
    regexp: '\s+{{ vm_fqdn | regex_escape }}'
    replace: ""

- name: Strip guest short hostname from other /etc/hosts lines
  ansible.builtin.replace:
    path: /etc/hosts
    regexp: '\s+{{ vm_hostname | regex_escape }}(?=\s|$)'
    replace: ""

- name: Remove empty 127.0.1.1 leftover lines from /etc/hosts
  ansible.builtin.replace:
    path: /etc/hosts
    regexp: '(?m)^127\.0\.1\.1\s*$'
    replace: ""

- name: Add guest hostname to /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ vm_ip }} {{ vm_fqdn }} {{ vm_hostname }}"
    insertafter: EOF
  when:
    - (guest_hosts_state | default("present")) == "present"
    - vm_ip | default("") | length > 0

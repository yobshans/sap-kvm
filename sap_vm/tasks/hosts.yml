---
# Manage the hypervisor /etc/hosts line for this guest.
# One plain line, no BEGIN/END markers. All previous IPs and leftover
# blockinfile markers for this VM are stripped first.

- name: Remove sap_vm marker comments from /etc/hosts
  ansible.builtin.replace:
    path: /etc/hosts
    regexp: '(?m)^# (BEGIN|END) sap_vm {{ vm_name | regex_escape }}\s*\n'
    replace: ""

- name: Remove existing guest hostname lines from /etc/hosts
  ansible.builtin.replace:
    path: /etc/hosts
    regexp: '(?m)^[0-9a-fA-F:.]+\s+{{ vm_fqdn | regex_escape }}(\s+{{ vm_hostname | regex_escape }})?\s*(\n|$)'
    replace: ""

- name: Add guest hostname to hypervisor /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ vm_ip }} {{ vm_fqdn }} {{ vm_hostname }}"
    insertafter: EOF
  when:
    - (guest_hosts_state | default("present")) == "present"
    - vm_ip | default("") | length > 0

---
# ============================================================================
# Hugepages — reserve 1 GiB hugepages on each NUMA node
# ============================================================================

- name: Read current hugepage reservation
  ansible.builtin.slurp:
    src: "/sys/devices/system/node/node{{ item }}/hugepages/hugepages-{{ hugepages_size_kb }}kB/nr_hugepages"
  loop: "{{ hugepage_nodes }}"
  register: hp_current

- name: Drop caches and compact memory before hugepage allocation
  when: vm_hugepage_prepare_memory | default(true) | bool
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail

      sync
      echo 3 > /proc/sys/vm/drop_caches
      echo 1 > /proc/sys/vm/compact_memory
  changed_when: true

- name: Reserve hugepages on each NUMA node
  ansible.builtin.copy:
    dest: "/sys/devices/system/node/node{{ item }}/hugepages/hugepages-{{ hugepages_size_kb }}kB/nr_hugepages"
    content: "{{ hugepages_per_node }}\n"
    unsafe_writes: true
  loop: "{{ hugepage_nodes }}"
  loop_control:
    index_var: hp_idx
  when: (hp_current.results[hp_idx].content | b64decode | trim | int) < (hugepages_per_node | int)

- name: Read hugepage totals after reservation
  ansible.builtin.slurp:
    src: "/sys/devices/system/node/node{{ item }}/hugepages/hugepages-{{ hugepages_size_kb }}kB/nr_hugepages"
  loop: "{{ hugepage_nodes }}"
  register: hp_count

- name: Read free hugepages
  ansible.builtin.slurp:
    src: "/sys/devices/system/node/node{{ item }}/hugepages/hugepages-{{ hugepages_size_kb }}kB/free_hugepages"
  loop: "{{ hugepage_nodes }}"
  register: hp_free

- name: Display hugepage status per node
  ansible.builtin.debug:
    msg: >-
      Node {{ item.0 }}: nr_hugepages={{ item.1.content | b64decode | trim }}
      free_hugepages={{ item.2.content | b64decode | trim }}
  loop: "{{ hugepage_nodes | zip(hp_count.results, hp_free.results) | list }}"

- name: Fail if enough free 1GiB hugepages are not available
  ansible.builtin.fail:
    msg: |
      Not enough free {{ hugepages_size_kb }} KiB hugepages are available for
      the guest. QEMU requires at least
      {{ hugepage_margin_required | default(hugepages_per_node) }} free pages on
      each NUMA node.

      Current reserved pages:
      {{ hp_count.results | map(attribute='content') | map('b64decode') | map('trim') | list }}
      Current free pages:
      {{ hp_free.results | map(attribute='content') | map('b64decode') | map('trim') | list }}
      NUMA nodes:
      {{ hugepage_nodes }}

      The role adds a margin for pages already in use, but the host still
      cannot provide enough free hugepages. Reboot with a larger static
      reservation or reduce the guest memory/other hugepage consumers.
  when: hp_free.results | map(attribute='content') | map('b64decode') | map('trim') | map('int') | select('lt', hugepage_margin_required | default(hugepages_per_node) | int) | list | length > 0

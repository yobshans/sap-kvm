---
# ============================================================================
# Hugepages — reserve 1 GiB hugepages on each NUMA node
# ============================================================================

- name: Read current hugepage reservation
  ansible.builtin.slurp:
    src: "/sys/devices/system/node/node{{ item }}/hugepages/hugepages-{{ hugepages_size_kb }}kB/nr_hugepages"
  loop: "{{ hugepage_nodes }}"
  register: hp_current

- name: Reserve hugepages on each NUMA node
  ansible.builtin.copy:
    dest: "/sys/devices/system/node/node{{ item }}/hugepages/hugepages-{{ hugepages_size_kb }}kB/nr_hugepages"
    content: "{{ hugepages_per_node }}\n"
    unsafe_writes: true
  loop: "{{ hugepage_nodes }}"
  loop_control:
    index_var: hp_idx
  when: (hp_current.results[hp_idx].content | b64decode | trim | int) < (hugepages_per_node | int)

- name: Read hugepage totals after reservation
  ansible.builtin.slurp:
    src: "/sys/devices/system/node/node{{ item }}/hugepages/hugepages-{{ hugepages_size_kb }}kB/nr_hugepages"
  loop: "{{ hugepage_nodes }}"
  register: hp_count

- name: Read free hugepages
  ansible.builtin.slurp:
    src: "/sys/devices/system/node/node{{ item }}/hugepages/hugepages-{{ hugepages_size_kb }}kB/free_hugepages"
  loop: "{{ hugepage_nodes }}"
  register: hp_free

- name: Display hugepage status per node
  ansible.builtin.debug:
    msg: >-
      Node {{ item.0 }}: nr_hugepages={{ item.1.content | b64decode | trim }}
      free_hugepages={{ item.2.content | b64decode | trim }}
  loop: "{{ hugepage_nodes | zip(hp_count.results, hp_free.results) | list }}"

- name: Fail if 1GiB hugepages are not reserved
  ansible.builtin.fail:
    msg: |
      1GiB hugepages could not be reserved at runtime (kernel still reports
      {{ hp_count.results | map(attribute='content') | map('b64decode') | map('trim') | list }} pages on nodes {{ hugepage_nodes }}).
      Need {{ hugepages_per_node }} pages of {{ hugepages_size_kb }} KiB per NUMA node
      ({{ (hugepages_per_node | int) * (hugepage_nodes | length) }} pages total).

      1GiB pages must be reserved at boot. Set nr_hugepages on the kernel command
      line, reboot, then re-run this playbook:

        grubby --update-kernel=ALL --args="default_hugepagesz=1G hugepagesz=1G hugepages={{ (hugepages_per_node | int) * (hugepage_nodes | length) }}"
        reboot

      After reboot, confirm with:
        grep Huge /proc/meminfo
        cat /sys/devices/system/node/node*/hugepages/hugepages-1048576kB/nr_hugepages

        ansible-playbook -vv create_sap_vm.yml -i inventory_vm.ini
  when: hp_count.results | map(attribute='content') | map('b64decode') | map('trim') | map('int') | select('lt', hugepages_per_node | int) | list | length > 0

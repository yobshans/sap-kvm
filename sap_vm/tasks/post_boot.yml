---
# ============================================================================
# Post-boot — wait for the guest and add it to the in-memory inventory
# Guest repos (from guest_image_compose_url), packages, SSH, and filesystem
# grow are applied by cloud-init. repo_update.yml (after this file) later
# repoints those repos at compose_url and runs dnf update.
#
# 192.168.122.0/24 is libvirt NAT on the hypervisor. A remote controller has
# no route there, so guest SSH jumps through hypervisor unless connection=local.
# ============================================================================

- name: Set guest SSH jump through the hypervisor
  ansible.builtin.set_fact:
    guest_ssh_via_hypervisor: "{{ (ansible_connection | default('ssh')) != 'local' }}"
    guest_ssh_jump_host: "{{ ansible_host | default(inventory_hostname) }}"
    guest_ssh_jump_user: "{{ ansible_user | default(ansible_ssh_user) | default('root') }}"
    guest_ssh_jump_port: "{{ ansible_port | default(22) }}"

- name: Render guest SSH args
  ansible.builtin.set_fact:
    guest_ssh_common_args: "{{ lookup('template', 'guest_ssh_args.j2') | trim }}"
  no_log: true

- name: Update hypervisor /etc/hosts with the guest IP
  ansible.builtin.include_tasks: hosts.yml
  vars:
    guest_hosts_state: present

- name: Show guest SSH path
  ansible.builtin.debug:
    msg: >-
      {{ 'Controller will SSH to guest ' ~ vm_ip
         ~ ' by jumping through '
         ~ guest_ssh_jump_user ~ '@' ~ guest_ssh_jump_host }}
  when: guest_ssh_via_hypervisor | bool

- name: Add guest to in-memory inventory
  ansible.builtin.add_host:
    name: "{{ vm_name }}_guest"
    groups: sap_guests
    ansible_host: "{{ vm_ip }}"
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false
    ansible_connection: ssh
  no_log: true

- name: Wait until guest accepts password SSH
  ansible.builtin.wait_for_connection:
    delay: 20
    sleep: 10
    timeout: 360
  delegate_to: "{{ vm_name }}_guest"
  become: false
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Wait for cloud-init boot finished marker
  ansible.builtin.wait_for:
    path: /var/lib/cloud/instance/boot-finished
    timeout: "{{ cloud_init_boot_timeout }}"
  delegate_to: "{{ vm_name }}_guest"
  become: false
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Update guest /etc/hosts with the NAT IP
  ansible.builtin.include_tasks:
    file: hosts.yml
    apply:
      delegate_to: "{{ vm_name }}_guest"
      become: false
      vars:
        ansible_user: root
        ansible_password: "{{ vm_root_password }}"
        ansible_ssh_pass: "{{ vm_root_password }}"
        ansible_python_interpreter: /usr/libexec/platform-python
        ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
        ansible_host_key_checking: false
  vars:
    guest_hosts_state: present

- name: Ensure libxcrypt-compat is installed on the guest
  ansible.builtin.dnf:
    name: libxcrypt-compat
    state: present
  delegate_to: "{{ vm_name }}_guest"
  become: false
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Set guest latency args on the kernel cmdline
  # THP (default madvise), mitigations=off, C1 C-state cap, and
  # cpuidle_haltpoll.force=1. Re-applies on existing guests (cloud-init
  # bootcmd only runs first boot). These only take effect after reboot —
  # see next tasks.
  ansible.builtin.command:
    cmd: >-
      grubby --update-kernel=ALL
      --remove-args="transparent_hugepage mitigations intel_idle.max_cstate processor.max_cstate cpuidle_haltpoll.force"
      --args="transparent_hugepage={{ vm_guest_thp }} mitigations=off intel_idle.max_cstate=1 processor.max_cstate=1 cpuidle_haltpoll.force=1"
  delegate_to: "{{ vm_name }}_guest"
  become: false
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Check whether the guest kernel cmdline already has latency args
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: >-
      grep -qw transparent_hugepage={{ vm_guest_thp }} /proc/cmdline &&
      grep -qw mitigations=off /proc/cmdline &&
      grep -qw intel_idle.max_cstate=1 /proc/cmdline &&
      grep -qw processor.max_cstate=1 /proc/cmdline &&
      grep -qw cpuidle_haltpoll.force=1 /proc/cmdline
  delegate_to: "{{ vm_name }}_guest"
  become: false
  register: guest_latency_cmdline
  changed_when: false
  failed_when: false
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Reboot the guest to apply latency cmdline args
  ansible.builtin.reboot:
    msg: "Rebooting guest for sap_vm latency cmdline (mitigations=off / C1 / THP / cpuidle_haltpoll.force)"
    reboot_timeout: "{{ vm_guest_reboot_timeout | int }}"
  delegate_to: "{{ vm_name }}_guest"
  become: false
  when: guest_latency_cmdline.rc != 0
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Apply transparent hugepage policy live on the guest
  ansible.builtin.copy:
    dest: /sys/kernel/mm/transparent_hugepage/enabled
    content: "{{ vm_guest_thp }}\n"
    unsafe_writes: true
  delegate_to: "{{ vm_name }}_guest"
  become: false
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Apply transparent hugepage defrag policy live on the guest
  ansible.builtin.copy:
    dest: /sys/kernel/mm/transparent_hugepage/defrag
    content: "{{ vm_guest_thp }}\n"
    unsafe_writes: true
  delegate_to: "{{ vm_name }}_guest"
  become: false
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Persist transparent hugepage settings across guest reboot
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/sap-thp.conf
    content: |
      w /sys/kernel/mm/transparent_hugepage/enabled - - - - {{ vm_guest_thp }}
      w /sys/kernel/mm/transparent_hugepage/defrag - - - - {{ vm_guest_thp }}
    mode: "0644"
  delegate_to: "{{ vm_name }}_guest"
  become: false
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Ensure the guest haltpoll module is loaded
  community.general.modprobe:
    name: haltpoll
    state: present
  delegate_to: "{{ vm_name }}_guest"
  become: false
  failed_when: false
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Check whether guest_halt_poll_ns is available
  ansible.builtin.stat:
    path: /sys/module/haltpoll/parameters/guest_halt_poll_ns
  delegate_to: "{{ vm_name }}_guest"
  become: false
  register: guest_halt_poll_ns_param
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Raise guest_halt_poll_ns (reduces vCPU wake-up latency)
  ansible.builtin.copy:
    dest: /sys/module/haltpoll/parameters/guest_halt_poll_ns
    content: "{{ vm_guest_halt_poll_ns }}"
    unsafe_writes: true
  delegate_to: "{{ vm_name }}_guest"
  become: false
  when: guest_halt_poll_ns_param.stat.exists
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Persist guest_halt_poll_ns across guest reboot/module reload
  ansible.builtin.copy:
    dest: /etc/modprobe.d/haltpoll-tuning.conf
    content: |
      options haltpoll guest_halt_poll_ns={{ vm_guest_halt_poll_ns }}
    mode: "0644"
  delegate_to: "{{ vm_name }}_guest"
  become: false
  when: guest_halt_poll_ns_param.stat.exists
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Disable irqbalance on the guest
  # Keep device IRQs on their bound vCPU; irqbalance rebalancing across
  # vCPUs adds latency noise for HANA/PBO. Re-applies on existing guests
  # (cloud-init runcmd only runs first boot).
  ansible.builtin.systemd:
    name: irqbalance
    state: stopped
    enabled: false
  delegate_to: "{{ vm_name }}_guest"
  become: false
  failed_when: false
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

# sap-hana-kvm-guest tuned profile (same intent as community.sap_infrastructure
# sap_vm_preconfigure, but THP/haltpoll match sap_vm defaults). tuned is in
# vm_packages; this creates the profile and activates it on every run.
- name: Discover guest tuned profile directory
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      if [[ -d /usr/lib/tuned/profiles ]] || [[ -d /etc/tuned/profiles ]]; then
          echo /etc/tuned/profiles
      else
          echo /usr/lib/tuned
      fi
  delegate_to: "{{ vm_name }}_guest"
  become: false
  register: guest_tuned_profile_parent
  changed_when: false
  when: (vm_guest_tuned_profile | default('')) | length > 0
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Ensure guest tuned profile directory exists
  ansible.builtin.file:
    path: "{{ guest_tuned_profile_parent.stdout }}/{{ vm_guest_tuned_profile }}"
    state: directory
    mode: "0755"
  delegate_to: "{{ vm_name }}_guest"
  become: false
  when: (vm_guest_tuned_profile | default('')) | length > 0
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Install guest tuned profile haltpoll helper script
  ansible.builtin.copy:
    dest: "{{ guest_tuned_profile_parent.stdout }}/{{ vm_guest_tuned_profile }}/haltpoll.sh"
    content: "{{ lookup('template', 'sap-hana-kvm-guest-haltpoll.sh.j2') }}"
    mode: "0755"
  delegate_to: "{{ vm_name }}_guest"
  become: false
  when: (vm_guest_tuned_profile | default('')) | length > 0
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Install guest tuned profile configuration
  ansible.builtin.copy:
    dest: "{{ guest_tuned_profile_parent.stdout }}/{{ vm_guest_tuned_profile }}/tuned.conf"
    content: "{{ lookup('template', 'sap-hana-kvm-guest-tuned.conf.j2') }}"
    mode: "0644"
  delegate_to: "{{ vm_name }}_guest"
  become: false
  when: (vm_guest_tuned_profile | default('')) | length > 0
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Ensure tuned is enabled and running on the guest
  ansible.builtin.systemd:
    name: tuned
    state: started
    enabled: true
  delegate_to: "{{ vm_name }}_guest"
  become: false
  when: (vm_guest_tuned_profile | default('')) | length > 0
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Activate guest tuned profile {{ vm_guest_tuned_profile }}
  ansible.builtin.command:
    cmd: "tuned-adm profile {{ vm_guest_tuned_profile }}"
  delegate_to: "{{ vm_name }}_guest"
  become: false
  register: guest_tuned_activate
  changed_when: true
  when: (vm_guest_tuned_profile | default('')) | length > 0
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Verify guest tuned profile is active
  ansible.builtin.command:
    cmd: tuned-adm active
  delegate_to: "{{ vm_name }}_guest"
  become: false
  register: guest_tuned_active
  changed_when: false
  failed_when: >-
    vm_guest_tuned_profile not in (guest_tuned_active.stdout | default(''))
  when: (vm_guest_tuned_profile | default('')) | length > 0
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Show active guest tuned profile
  ansible.builtin.debug:
    msg: "{{ guest_tuned_active.stdout }}"
  when:
    - (vm_guest_tuned_profile | default('')) | length > 0
    - guest_tuned_active is defined

- name: Set SELinux permissive on the guest
  ansible.builtin.copy:
    dest: /sys/fs/selinux/enforce
    content: "0"
    unsafe_writes: true
  delegate_to: "{{ vm_name }}_guest"
  become: false
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false
  failed_when: false

- name: Persist SELinux permissive across guest reboot
  ansible.builtin.replace:
    path: /etc/selinux/config
    regexp: '^SELINUX=.*'
    replace: SELINUX=permissive
  delegate_to: "{{ vm_name }}_guest"
  become: false
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Forget previous guest SSH host keys
  ansible.builtin.include_tasks: ssh_known_hosts.yml

- name: Read guest SSH host public keys
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - /etc/ssh/ssh_host_ed25519_key.pub
    - /etc/ssh/ssh_host_ecdsa_key.pub
    - /etc/ssh/ssh_host_rsa_key.pub
  delegate_to: "{{ vm_name }}_guest"
  become: false
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false
  register: guest_ssh_host_pubs
  failed_when: false

- name: Trust guest SSH host keys on the hypervisor
  ansible.builtin.known_hosts:
    path: "{{ guest_known_hosts_file }}"
    name: "{{ item.0 }}"
    key: "{{ item.0 }} {{ (item.1.content | b64decode).split()[:2] | join(' ') }}"
  loop: "{{ ([vm_ip, vm_hostname, vm_fqdn] | unique) | product(guest_ssh_host_pubs.results | selectattr('content', 'defined') | list) | list }}"
  loop_control:
    label: "{{ item.0 }} {{ item.1.item | basename }}"
  when:
    - item.0 | default('') | length > 0
    - item.1.content is defined

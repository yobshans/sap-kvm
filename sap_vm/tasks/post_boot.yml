---
# ============================================================================
# Post-boot — wait for the guest and add it to the in-memory inventory
# Guest repos, packages, SSH, and filesystem grow are applied by cloud-init.
#
# 192.168.122.0/24 is libvirt NAT on the hypervisor. A remote controller has
# no route there, so guest SSH jumps through kvm_host unless connection=local.
# ============================================================================

- name: Set guest SSH jump through the hypervisor
  ansible.builtin.set_fact:
    guest_ssh_via_hypervisor: "{{ (ansible_connection | default('ssh')) != 'local' }}"
    guest_ssh_jump_host: "{{ ansible_host | default(inventory_hostname) }}"
    guest_ssh_jump_user: "{{ ansible_user | default(ansible_ssh_user) | default('root') }}"
    guest_ssh_jump_port: "{{ ansible_port | default(22) }}"

- name: Render guest SSH args
  ansible.builtin.set_fact:
    guest_ssh_common_args: "{{ lookup('template', 'guest_ssh_args.j2') | trim }}"
  no_log: true

- name: Show guest SSH path
  ansible.builtin.debug:
    msg: >-
      {{ 'Controller will SSH to guest ' ~ vm_ip
         ~ ' by jumping through '
         ~ guest_ssh_jump_user ~ '@' ~ guest_ssh_jump_host }}
  when: guest_ssh_via_hypervisor | bool

- name: Add guest to in-memory inventory
  ansible.builtin.add_host:
    name: "{{ vm_name }}_guest"
    groups: sap_guests
    ansible_host: "{{ vm_ip }}"
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false
    ansible_connection: ssh
  no_log: true

- name: Wait until guest accepts password SSH
  ansible.builtin.wait_for_connection:
    delay: 20
    sleep: 10
    timeout: 360
  delegate_to: "{{ vm_name }}_guest"
  become: false
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

- name: Wait for cloud-init boot finished marker
  ansible.builtin.wait_for:
    path: /var/lib/cloud/instance/boot-finished
    timeout: 300
  delegate_to: "{{ vm_name }}_guest"
  become: false
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args }}"
    ansible_host_key_checking: false

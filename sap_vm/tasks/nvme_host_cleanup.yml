---
# sap_vm/tasks/nvme_host_cleanup.yml — Reset a hypervisor NVMe device before
# handing it to a KVM guest for PCI passthrough.
#
# This runs before tasks/nvme.yml when vm_nvme=true. It is intentionally
# noninteractive and targets vm_nvme_device (default /dev/nvme0n1), even if
# /hana/data and /hana/log are not currently mounted, so a device left with
# partitions from a previous host-side SAP HANA / PBO run is made eligible
# for passthrough.

- name: Validate the configured NVMe device
  ansible.builtin.command:
    cmd: "lsblk -ndo TRAN {{ vm_nvme_device }}"
  register: _vm_nvme_transport
  changed_when: false
  failed_when: _vm_nvme_transport.stdout | trim != 'nvme'

- name: Find mountpoints on the configured NVMe device
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail

      lsblk -nrpo NAME,MOUNTPOINT "{{ vm_nvme_device }}" |
        awk '$2 != "" {print $2}'
  register: _vm_nvme_mountpoints
  changed_when: false

- name: Unmount filesystems on the configured NVMe device
  ansible.builtin.command:
    cmd: "umount {{ item }}"
  loop: "{{ _vm_nvme_mountpoints.stdout_lines }}"
  loop_control:
    label: "{{ item }}"

- name: Remove SAP HANA data mount from /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\s*[^#].*\s/hana/data\s+'
    state: absent

- name: Remove SAP HANA log mount from /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\s*[^#].*\s/hana/log\s+'
    state: absent

- name: Wipe partitions and signatures on the configured NVMe device
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail

      dev="{{ vm_nvme_device }}"
      mapfile -t parts < <(
          lsblk -nrpo NAME,TYPE "$dev" | awk '$2 == "part" {print $1}'
      )
      for part in "${parts[@]}"; do
          wipefs -af "$part" || true
      done
      wipefs -af "$dev" || true
      partprobe "$dev" || true

- name: Remove SAP resource-limit and tuning configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/security/limits.d/99-sap.conf
    - /etc/tmpfiles.d/sap.conf
    - /etc/sysctl.d/sap.conf

- name: Reload sysctl settings after SAP configuration removal
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

- name: Show the reset NVMe device
  ansible.builtin.command:
    cmd: "lsblk {{ vm_nvme_device }}"
  register: _vm_nvme_cleanup_lsblk
  changed_when: false

- name: NVMe host cleanup summary
  ansible.builtin.debug:
    msg: "{{ _vm_nvme_cleanup_lsblk.stdout_lines }}"

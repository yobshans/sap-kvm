---
# ============================================================================
# KVM HANA VM — Main task orchestrator
# ============================================================================

- name: Include preflight checks
  ansible.builtin.include_tasks: preflight.yml
  tags: [preflight]

- name: Include cleanup tasks (when destroy_existing_vm=true)
  ansible.builtin.include_tasks: cleanup.yml
  when: destroy_existing_vm | bool
  tags: [cleanup]

- name: Include hypervisor topology discovery
  ansible.builtin.include_tasks:
    file: topology.yml
    apply:
      tags: [always, topology]
  tags: [always, topology]

- name: Include hypervisor host tuning (CPU isolation + static hugepages + mitigations=off; may reboot the hypervisor)
  ansible.builtin.include_tasks: host_tuning.yml
  tags: [host_tuning]

- name: Include KVM kernel module tuning (halt_poll_ns / lapic_timer_advance_ns / ple_gap)
  ansible.builtin.include_tasks: kvm_tuning.yml
  tags: [kvm_tuning]

- name: Include hugepages configuration
  ansible.builtin.include_tasks: hugepages.yml
  tags: [hugepages]

- name: Include disk preparation
  ansible.builtin.include_tasks: disk.yml
  tags: [disk]

- name: Include raw disk conversion (when enabled)
  ansible.builtin.include_tasks: raw_convert.yml
  when: guest_raw_image | bool
  tags: [raw_convert]

- name: Include secondary data disk preparation (local qcow2, when vm_nvme is false)
  ansible.builtin.include_tasks: data_disk.yml
  when: not (vm_nvme | bool)
  tags: [disk, data_disk]

- name: Include hypervisor NVMe cleanup before PCI passthrough
  ansible.builtin.include_tasks: nvme_host_cleanup.yml
  when: vm_nvme | bool
  tags: [nvme_cleanup]

- name: Include NVMe PCI passthrough preparation (when vm_nvme is true)
  ansible.builtin.include_tasks: nvme.yml
  when: vm_nvme | bool
  tags: [disk, nvme]

- name: Include cloud-init setup
  ansible.builtin.include_tasks: cloud_init.yml
  tags: [cloud_init]

- name: Include VM definition and start
  ansible.builtin.include_tasks: vm_define.yml
  tags: [vm_define]

- name: Include post-boot configuration
  ansible.builtin.include_tasks: post_boot.yml
  tags: [post_boot]

- name: Include repo update and dnf update (when enabled)
  ansible.builtin.include_tasks: repo_update.yml
  when: guest_update_packages | bool
  tags: [repo_update]

- name: Include verification
  ansible.builtin.include_tasks: verify.yml
  tags: [verify]

---
# ============================================================================
# Disk — prepare VM disk image from RHEL guest image
# ============================================================================

- name: Create KVM base directory
  ansible.builtin.file:
    path: "{{ kvm_base_dir }}"
    state: directory
    mode: "0755"

- name: Download RHEL guest image (when enabled)
  ansible.builtin.get_url:
    url: "{{ guest_image_url }}"
    dest: "{{ kvm_base_dir }}/{{ guest_image_filename }}"
    mode: "0644"
  when: download_guest_image | bool

- name: Check source image exists
  ansible.builtin.stat:
    path: "{{ kvm_base_dir }}/{{ guest_image_filename }}"
  register: src_image

- name: Fail if source image missing
  ansible.builtin.fail:
    msg: >
      Source image not found at {{ kvm_base_dir }}/{{ guest_image_filename }}.
      Set download_guest_image=true or copy the image manually.
  when: not src_image.stat.exists

- name: Check if VM disk already exists
  ansible.builtin.stat:
    path: "{{ vm_disk_path }}"
  register: vm_disk

- name: Copy guest image to VM disk
  ansible.builtin.copy:
    src: "{{ kvm_base_dir }}/{{ guest_image_filename }}"
    dest: "{{ vm_disk_path }}"
    remote_src: true
    mode: "0644"
  when: not vm_disk.stat.exists

- name: Gather libvirt storage pool facts
  community.libvirt.virt_pool:
    command: facts

- name: Use the pool that already owns kvm_base_dir
  ansible.builtin.set_fact:
    libvirt_pool: "{{ existing_kvm_pools[0] }}"
  vars:
    existing_kvm_pools: "{{ ansible_libvirt_pools | dict2items | selectattr('value.path', 'defined') | selectattr('value.path', 'equalto', kvm_base_dir) | map(attribute='key') | list }}"
  when: existing_kvm_pools | length > 0

- name: Define libvirt directory pool when none covers kvm_base_dir
  community.libvirt.virt_pool:
    name: "{{ libvirt_pool }}"
    state: present
    xml: "{{ lookup('template', 'libvirt-pool.xml.j2') }}"
  when: libvirt_pool not in ansible_libvirt_pools

- name: Build libvirt directory pool
  community.libvirt.virt_pool:
    command: build
    name: "{{ libvirt_pool }}"
  register: libvirt_pool_build
  when: libvirt_pool not in ansible_libvirt_pools
  failed_when:
    - libvirt_pool_build is failed
    - libvirt_pool_build.msg | default('') is not search('already')

- name: Start libvirt directory pool
  community.libvirt.virt_pool:
    name: "{{ libvirt_pool }}"
    state: active

- name: Autostart libvirt directory pool
  community.libvirt.virt_pool:
    name: "{{ libvirt_pool }}"
    autostart: true

- name: Refresh libvirt directory pool
  community.libvirt.virt_pool:
    command: refresh
    name: "{{ libvirt_pool }}"

- name: Show selected libvirt pool
  ansible.builtin.debug:
    msg: "Using libvirt pool '{{ libvirt_pool }}' for {{ kvm_base_dir }}"

- name: Resize VM disk to {{ vm_disk_size }}
  community.libvirt.virt_volume:
    pool: "{{ libvirt_pool }}"
    state: present
    xml: |
      <volume>
        <name>{{ vm_name }}.qcow2</name>
        <capacity unit="{{ vm_disk_size[-1] | upper }}">{{ vm_disk_size[:-1] }}</capacity>
        <target>
          <format type="qcow2"/>
          <path>{{ vm_disk_path }}</path>
        </target>
      </volume>
  when: not vm_disk.stat.exists

- name: Stat VM disk after prepare
  ansible.builtin.stat:
    path: "{{ vm_disk_path }}"
  register: disk_info

- name: Display disk info
  ansible.builtin.debug:
    msg:
      - "path: {{ vm_disk_path }}"
      - "size: {{ disk_info.stat.size }} bytes"
      - "requested: {{ vm_disk_size }}"

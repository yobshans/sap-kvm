---
# ============================================================================
# Verify — validate VM matches expected SAP HANA configuration
# ============================================================================

- name: Verify VM virt type
  ansible.builtin.shell: >
    sshpass -p '{{ vm_root_password }}' ssh {{ vm_ssh_opts }}
    root@{{ vm_ip }} 'systemd-detect-virt'
  register: virt_type
  changed_when: false

- name: Assert VM is KVM
  ansible.builtin.assert:
    that:
      - virt_type.stdout is search('kvm')
    fail_msg: "VM is not running under KVM (got: {{ virt_type.stdout }})"
    success_msg: "VM running under KVM ✓"

- name: Gather guest CPU topology
  ansible.builtin.shell: >
    sshpass -p '{{ vm_root_password }}' ssh {{ vm_ssh_opts }}
    root@{{ vm_ip }} 'lscpu'
  register: guest_lscpu
  changed_when: false

- name: Display guest CPU topology
  ansible.builtin.debug:
    var: guest_lscpu.stdout_lines

- name: Assert correct vCPU count
  ansible.builtin.assert:
    that:
      - guest_lscpu.stdout is regex('CPU\\(s\\):\\s+' ~ (vm_vcpus | string) ~ '\\b')
    fail_msg: "Expected {{ vm_vcpus }} vCPUs"
    success_msg: "{{ vm_vcpus }} vCPUs ✓"

- name: Gather guest NUMA topology
  ansible.builtin.shell: >
    sshpass -p '{{ vm_root_password }}' ssh {{ vm_ssh_opts }}
    root@{{ vm_ip }} 'numactl --hardware'
  register: guest_numa
  changed_when: false

- name: Display guest NUMA topology
  ansible.builtin.debug:
    var: guest_numa.stdout_lines

- name: Assert NUMA node count
  ansible.builtin.assert:
    that:
      - guest_numa.stdout is regex('available:\\s+' ~ (vm_numa_nodes | string) ~ '\\s+nodes')
    fail_msg: "Expected {{ vm_numa_nodes }} NUMA nodes"
    success_msg: "{{ vm_numa_nodes }} NUMA nodes ✓"

- name: Gather guest memory
  ansible.builtin.shell: >
    sshpass -p '{{ vm_root_password }}' ssh {{ vm_ssh_opts }}
    root@{{ vm_ip }} 'free -h'
  register: guest_mem
  changed_when: false

- name: Display guest memory
  ansible.builtin.debug:
    var: guest_mem.stdout_lines

- name: Gather guest disk
  ansible.builtin.shell: >
    sshpass -p '{{ vm_root_password }}' ssh {{ vm_ssh_opts }}
    root@{{ vm_ip }} 'lsblk; echo "---"; df -h /'
  register: guest_disk
  changed_when: false

- name: Display guest disk
  ansible.builtin.debug:
    var: guest_disk.stdout_lines

- name: Verify host-side CPU pinning
  ansible.builtin.command: virsh vcpupin {{ vm_name }}
  register: vcpupin_info
  changed_when: false

- name: Display CPU pinning
  ansible.builtin.debug:
    var: vcpupin_info.stdout_lines

- name: Verify host-side NUMA placement (numastat)
  ansible.builtin.shell: |
    QEMU_PID=$(pgrep -f 'qemu.*{{ vm_name }}' | head -1)
    if [ -n "$QEMU_PID" ]; then
      numastat -p $QEMU_PID
    else
      echo "QEMU process not found"
    fi
  register: numastat_info
  changed_when: false

- name: Display NUMA placement
  ansible.builtin.debug:
    var: numastat_info.stdout_lines

- name: Verify hugepage usage
  ansible.builtin.shell: |
    echo "=== Hugepage usage after VM start ==="
    for n in {{ hugepage_nodes | join(' ') }}; do
      echo "Node $n:"
      echo "  total: $(cat /sys/devices/system/node/node${n}/hugepages/hugepages-{{ hugepages_size_kb }}kB/nr_hugepages)"
      echo "  free:  $(cat /sys/devices/system/node/node${n}/hugepages/hugepages-{{ hugepages_size_kb }}kB/free_hugepages)"
    done
  register: hp_usage
  changed_when: false

- name: Display hugepage usage
  ansible.builtin.debug:
    var: hp_usage.stdout_lines

- name: "=== SUMMARY ==="
  ansible.builtin.debug:
    msg:
      - "============================================"
      - "  VM '{{ vm_name }}' created successfully!"
      - "============================================"
      - "  IP:         {{ vm_ip }}"
      - "  vCPUs:      {{ vm_vcpus }}"
      - "  Memory:     {{ vm_memory_mib }} MiB"
      - "  NUMA nodes: {{ vm_numa_nodes }}"
      - "  Disk:       {{ vm_disk_size }}"
      - "  SSH:        ssh root@{{ vm_ip }}"
      - "  Password:   *****"
      - "============================================"

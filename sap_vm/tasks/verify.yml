---
# ============================================================================
# Verify — validate VM matches expected SAP HANA configuration
# ============================================================================

- name: Gather guest facts
  ansible.builtin.setup:
  delegate_to: "{{ vm_name }}_guest"
  become: false
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args | default(vm_ssh_opts) }}"
    ansible_host_key_checking: false
  register: guest_setup

- name: Assert VM is KVM
  ansible.builtin.assert:
    that:
      - guest_setup.ansible_facts.ansible_virtualization_type is search('kvm')
    fail_msg: "VM is not running under KVM (got: {{ guest_setup.ansible_facts.ansible_virtualization_type }})"
    success_msg: "VM running under KVM ✓"

- name: Display guest CPU facts
  ansible.builtin.debug:
    msg:
      - "vCPUs: {{ guest_setup.ansible_facts.ansible_processor_vcpus }}"
      - "Sockets: {{ guest_setup.ansible_facts.ansible_processor_count }}"
      - "Cores: {{ guest_setup.ansible_facts.ansible_processor_cores }}"

- name: Assert correct vCPU count
  ansible.builtin.assert:
    that:
      - (guest_setup.ansible_facts.ansible_processor_vcpus | int) == (vm_vcpus | int)
    fail_msg: "Expected {{ vm_vcpus }} vCPUs"
    success_msg: "{{ vm_vcpus }} vCPUs ✓"

- name: List guest NUMA nodes
  ansible.builtin.find:
    paths: /sys/devices/system/node
    patterns: "node[0-9]*"
    file_type: directory
  delegate_to: "{{ vm_name }}_guest"
  become: false
  vars:
    ansible_user: root
    ansible_password: "{{ vm_root_password }}"
    ansible_ssh_pass: "{{ vm_root_password }}"
    ansible_python_interpreter: /usr/libexec/platform-python
    ansible_ssh_common_args: "{{ hostvars[inventory_hostname].guest_ssh_common_args | default(vm_ssh_opts) }}"
    ansible_host_key_checking: false
  register: guest_numa_dirs

- name: Assert NUMA node count
  ansible.builtin.assert:
    that:
      - (guest_numa_dirs.files | length) == (vm_numa_nodes | int)
    fail_msg: "Expected {{ vm_numa_nodes }} NUMA nodes"
    success_msg: "{{ vm_numa_nodes }} NUMA nodes ✓"

- name: Display guest memory
  ansible.builtin.debug:
    msg: "MemTotal: {{ guest_setup.ansible_facts.ansible_memtotal_mb }} MiB"

- name: Display guest root filesystem
  ansible.builtin.debug:
    msg: "{{ guest_setup.ansible_facts.ansible_mounts | selectattr('mount', 'equalto', '/') | list }}"

- name: Read domain XML for CPU pinning
  community.libvirt.virt:
    command: get_xml
    name: "{{ vm_name }}"
  register: vcpupin_info

- name: Display CPU pinning from domain XML
  ansible.builtin.debug:
    var: vcpupin_info.get_xml

- name: Read hugepage usage after VM start
  ansible.builtin.slurp:
    src: "/sys/devices/system/node/node{{ item.0 }}/hugepages/hugepages-{{ hugepages_size_kb }}kB/{{ item.1 }}"
  loop: "{{ hugepage_nodes | product(['nr_hugepages', 'free_hugepages']) | list }}"
  loop_control:
    label: "node{{ item.0 }}/{{ item.1 }}"
  register: hp_usage

- name: Display hugepage usage
  ansible.builtin.debug:
    msg: >-
      Node {{ item.item.0 }} {{ item.item.1 }}:
      {{ item.content | b64decode | trim }}
  loop: "{{ hp_usage.results }}"
  loop_control:
    label: "node{{ item.item.0 }}/{{ item.item.1 }}"

- name: "=== SUMMARY ==="
  ansible.builtin.debug:
    msg:
      - "============================================"
      - "  VM '{{ vm_name }}' created successfully!"
      - "============================================"
      - "  IP:         {{ vm_ip }}"
      - "  vCPUs:      {{ vm_vcpus }}"
      - "  Memory:     {{ vm_memory_mib }} MiB"
      - "  NUMA nodes: {{ vm_numa_nodes }}"
      - "  Disk:       {{ vm_disk_size }}"
      - "============================================"

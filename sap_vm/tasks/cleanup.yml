---
# ============================================================================
# Cleanup — destroy existing VM if requested
# ============================================================================

- name: List defined VMs
  community.libvirt.virt:
    command: list_vms
  register: defined_vms

- name: Destroy running VM
  community.libvirt.virt:
    name: "{{ vm_name }}"
    state: destroyed
  when: vm_name in (defined_vms.list_vms | default([]))
  failed_when: false

- name: Undefine VM
  community.libvirt.virt:
    command: undefine
    name: "{{ vm_name }}"
    force: true
  when: vm_name in (defined_vms.list_vms | default([]))
  failed_when: false

- name: Remove old VM disk(s)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ vm_disk_path }}"
    - "{{ vm_disk_raw_path }}"
    - "{{ vm_data_disk_path }}"

# NVMe passthrough devices (vm_nvme=true) are physical hardware, not a file
# under kvm_base_dir -- nothing to remove here. They are left bound to
# vfio-pci so a VM recreated right after reuses them without re-binding;
# unbind manually (see README.md) to hand a device back to the host's nvme
# driver.

- name: Remove old cloud-init volume
  community.libvirt.virt_volume:
    pool: "{{ libvirt_pool }}"
    state: absent
    name: "{{ cloud_init_iso | basename }}"
  failed_when: false

- name: Remove old cloud-init ISO
  ansible.builtin.file:
    path: "{{ cloud_init_iso }}"
    state: absent

- name: Remove guest hostname from hypervisor /etc/hosts
  ansible.builtin.include_tasks: hosts.yml
  vars:
    guest_hosts_state: absent

- name: Remove stale SSH host keys for the guest
  ansible.builtin.include_tasks: ssh_known_hosts.yml

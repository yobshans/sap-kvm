---
# ============================================================================
# Cloud-init — generate seed ISO for first-boot configuration
# ============================================================================

- name: Create cloud-init directory
  ansible.builtin.file:
    path: "{{ cloud_init_dir }}"
    state: directory
    mode: "0755"

- name: Write cloud-init user-data
  ansible.builtin.template:
    src: user-data.j2
    dest: "{{ cloud_init_dir }}/user-data"
    mode: "0644"

- name: Write cloud-init meta-data
  ansible.builtin.template:
    src: meta-data.j2
    dest: "{{ cloud_init_dir }}/meta-data"
    mode: "0644"

- name: Read cloud-init user-data
  ansible.builtin.slurp:
    src: "{{ cloud_init_dir }}/user-data"
  register: userdata_file

- name: Read cloud-init meta-data
  ansible.builtin.slurp:
    src: "{{ cloud_init_dir }}/meta-data"
  register: metadata_file

- name: Remove stale cloud-init volume
  community.libvirt.virt_volume:
    pool: "{{ libvirt_pool }}"
    state: absent
    name: "{{ cloud_init_iso | basename }}"
  failed_when: false

- name: Remove stale cloud-init ISO
  ansible.builtin.file:
    path: "{{ cloud_init_iso }}"
    state: absent

- name: Refresh libvirt pool after ISO removal
  community.libvirt.virt_pool:
    command: refresh
    name: "{{ libvirt_pool }}"
  failed_when: false

- name: Generate cloud-init ISO
  community.libvirt.virt_volume:
    pool: "{{ libvirt_pool }}"
    command: create_cidata_cdrom
    name: "{{ cloud_init_iso | basename }}"
    cloudinit_config:
      USERDATA: "{{ userdata_file.content | b64decode | from_yaml }}"
      METADATA: "{{ metadata_file.content | b64decode | from_yaml }}"

---
# ============================================================================
# VM Define — create and start the KVM domain
# ============================================================================

- name: List defined VMs
  community.libvirt.virt:
    command: list_vms
  register: defined_vms

- name: Get VM status
  community.libvirt.virt:
    command: status
    name: "{{ vm_name }}"
  register: vm_state
  when: vm_name in (defined_vms.list_vms | default([]))
  failed_when: false

- name: Generate VM domain XML
  ansible.builtin.template:
    src: vm-domain.xml.j2
    dest: "{{ kvm_base_dir }}/{{ vm_name }}.xml"
    mode: "0644"
  when: >
    vm_name not in (defined_vms.list_vms | default([]))
    or (vm_state.status | default('')) != 'running'

- name: Read domain XML
  ansible.builtin.slurp:
    src: "{{ kvm_base_dir }}/{{ vm_name }}.xml"
  register: vm_xml_file
  when: >
    vm_name not in (defined_vms.list_vms | default([]))
    or (vm_state.status | default('')) != 'running'

- name: Define VM from XML
  community.libvirt.virt:
    command: define
    xml: "{{ vm_xml_file.content | b64decode }}"
  when: >
    vm_name not in (defined_vms.list_vms | default([]))
    or (vm_state.status | default('')) != 'running'

- name: Start VM
  community.libvirt.virt:
    name: "{{ vm_name }}"
    state: running
  register: vm_start
  when: (vm_state.status | default('')) != 'running'
  failed_when: false

- name: Use libvirt host TSC frequency when the requested value is rejected
  when:
    - not (vm_start.skipped | default(false))
    - vm_start.failed | default(false)
    - (vm_start.msg | default('') | string ~ vm_start.exception | default('') | string) is search('TSC frequency')
  block:
    - name: Parse host TSC frequency from libvirt
      # regex_search always returns a list when given a backreference arg,
      # even for a single group (['3000000000'], not '3000000000') -- index
      # into it or the digits-only check below never matches.
      ansible.builtin.set_fact:
        vm_tsc_frequency: "{{ (vm_start.msg | regex_search('host frequency ([0-9]+) Hz', '\\1') | default([''], true))[0] }}"

    - name: Fail if libvirt did not advertise a host TSC frequency
      ansible.builtin.fail:
        msg: "{{ vm_start.msg }}"
      when: not (vm_tsc_frequency | default('') | string | regex_search('^[0-9]+$'))

    - name: Show corrected TSC frequency
      ansible.builtin.debug:
        msg: "Host CPU does not support TSC scaling; using {{ vm_tsc_frequency }} Hz"

    - name: Regenerating domain XML with host TSC frequency
      ansible.builtin.template:
        src: vm-domain.xml.j2
        dest: "{{ kvm_base_dir }}/{{ vm_name }}.xml"
        mode: "0644"

    - name: Read corrected domain XML
      ansible.builtin.slurp:
        src: "{{ kvm_base_dir }}/{{ vm_name }}.xml"
      register: vm_xml_retry

    - name: Redefine VM with host TSC frequency
      community.libvirt.virt:
        command: define
        xml: "{{ vm_xml_retry.content | b64decode }}"

    - name: Start VM after TSC correction
      community.libvirt.virt:
        name: "{{ vm_name }}"
        state: running
      register: vm_start_retry

- name: Fail if the VM did not start
  ansible.builtin.fail:
    msg: "{{ vm_start.msg | default('failed to start VM') }}"
  when:
    - not (vm_start.skipped | default(false))
    - vm_start.failed | default(false)
    - vm_start_retry is not defined

- name: Fail if the VM did not start after TSC correction
  ansible.builtin.fail:
    msg: "{{ vm_start_retry.msg | default('failed to start VM after TSC correction') }}"
  when:
    - vm_start_retry is defined
    - vm_start_retry.failed | default(false)

- name: Wait for the VM to return to running after first-boot reboot
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail

      for _ in $(seq 1 20); do
          state=$(virsh domstate "{{ vm_name }}" 2>/dev/null || true)
          if [[ "$state" == "running" ]]; then
              exit 0
          fi
          sleep 3
      done

      exit 1
  register: vm_running_wait
  changed_when: false
  failed_when: false

- name: Read the QEMU log if the VM did not stay running
  when: vm_running_wait.rc != 0
  ansible.builtin.command:
    cmd: "tail -n 100 /var/log/libvirt/qemu/{{ vm_name }}.log"
  register: vm_qemu_log_tail
  changed_when: false
  failed_when: false

- name: Fail if the VM did not stay running
  when: vm_running_wait.rc != 0
  ansible.builtin.fail:
    msg: >-
      VM {{ vm_name }} did not return to the running state within 60 seconds.
      This can happen when the first-boot cloud-init kernel-argument update
      triggers a reboot, but a persistent shutdown usually means QEMU exited.

      QEMU log tail:
      {{ vm_qemu_log_tail.stdout | default('(log unavailable)') }}

- name: Set VM to autostart
  community.libvirt.virt:
    name: "{{ vm_name }}"
    autostart: true

- name: Display VM info
  community.libvirt.virt:
    command: info
    name: "{{ vm_name }}"
  register: vm_running_info

- name: Show VM info
  ansible.builtin.debug:
    var: vm_running_info

- name: Wait for VM DHCP lease
  community.libvirt.virt:
    command: get_ifaddresses
    name: "{{ vm_name }}"
    flags:
      - lease
  register: vm_ifs
  retries: 40
  delay: 3
  until: (vm_ifs | to_json) is search('192\\.168\\.')
  failed_when: false

- name: Fail with diagnostics if no DHCP lease appeared
  ansible.builtin.fail:
    msg: >-
      {{ vm_name }} is running but never leased an IP on the '{{ vm_network }}'
      network after 120s. The VM itself is up (see "Display VM info" above), so
      this is almost always a guest-side networking/cloud-init problem, not a
      libvirt one. On the hypervisor, check:
        virsh net-dhcp-leases {{ vm_network }}
        virsh domiflist {{ vm_name }}
        virsh console {{ vm_name }}   # watch for a boot hang (dracut, GRUB,
                                     # "no bootable device", cloud-init NoCloud
                                     # datasource not found, etc.)
      A running domain with zero leases almost always means the guest OS
      never got past early boot, so DHCP was never requested.
  when: not ((vm_ifs | to_json) is search('192\\.168\\.'))

- name: Set VM IP fact
  ansible.builtin.set_fact:
    vm_ip: "{{ vm_ifs | to_json | regex_search('192\\.168\\.\\d+\\.\\d+') }}"

- name: Display VM IP
  ansible.builtin.debug:
    msg: "VM IP address: {{ vm_ip }}"

- name: Wait for SSH to become available
  ansible.builtin.wait_for:
    host: "{{ vm_ip }}"
    port: 22
    delay: 5
    timeout: 120
    state: started

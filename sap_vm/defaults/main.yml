---
# ============================================================================
# KVM HANA VM — Role Defaults
# ============================================================================

# --- VM identity ---
vm_name: sap-kvm-vm
vm_hostname: sap-kvm-vm
vm_domain: lab.eng.tlv2.redhat.com
vm_fqdn: "{{ vm_hostname }}.{{ vm_domain }}"
# Root password is not stored in git. Required at runtime:
#   ansible-playbook ... -e vm_root_password='...'
# Non-interactive SSH into the guest (never prompt for a password)
vm_ssh_opts: >-
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
  -o PreferredAuthentications=password
  -o PubkeyAuthentication=no
  -o NumberOfPasswordPrompts=1
  -o ConnectTimeout=10
# Interactive ssh on the hypervisor (strict checking). Recreates replace host keys.
guest_known_hosts_file: /root/.ssh/known_hosts

# --- Guest topology ---
# Set any of these to a concrete value to override discovery.
# "auto" derives layout from the hypervisor (SAP HANA on KVM best practices):
#   sockets = host NUMA nodes
#   cores   = host cores/node minus 1 (first core reserved for emulator/iothread)
#   threads = host SMT
#   memory  = host NUMA memory minus hypervisor reserve, 1 GiB aligned
vm_vcpus: auto
vm_memory_mib: auto
vm_sockets: auto
vm_cores_per_socket: auto
vm_threads_per_core: auto
vm_numa_nodes: auto
vm_numa_memory_mib: auto
vm_cpu_features:
  - rdtscp
  - invtsc
  - x2apic

# --- Host → guest mapping ---
host_reserve_first_core: true
hypervisor_reserve_gib: 100            # PDF rule of thumb; scaled down on small hosts
hypervisor_reserve_min_gib_per_node: 2
vm_memory_min_gib: 64                  # HCMT/HANA floor when auto-sizing

# --- IO threads / emulator pinning (auto from reserved host cores) ---
vm_iothreads: 1
vm_emulatorpin: auto
vm_iothreadpin: auto

# TSC frequency (Hz). auto = host TSC (required when the CPU has no TSC scaling)
vm_tsc_frequency: auto

# --- Hugepages (prefer 1 GiB; discovery falls back to 2 MiB if unavailable) ---
hugepages_size_kb: 1048576
hugepages_per_node: auto
hugepage_nodes: auto

# --- RHEL compose (image URL and guest yum repos are derived from this) ---
# Override with -e compose_url='http://.../RHEL-10.2-YYYYMMDD.N'
compose_url: "http://download.eng.tlv.redhat.com/rhel-10/composes/RHEL-10/RHEL-10.2-20260507.1"
compose_id: "{{ compose_url | regex_replace('/+$', '') | basename }}"
compose_release: "{{ compose_id | regex_replace('^RHEL-', '') | regex_replace('-[0-9]{8}.*$', '') }}"
compose_major: "{{ compose_release.split('.') | first }}"

# --- Storage ---
kvm_base_dir: /home/kvm
# Used only when no existing pool already has this target path (this host has pool "kvm")
libvirt_pool: sap-kvm
# Remote qcow2 name follows the compose id (RHEL-10.2-YYYYMMDD.N →
# rhel-guest-image-10.2-YYYYMMDD.N.x86_64.qcow2). Local name does not.
guest_image_url: "{{ compose_url | regex_replace('/+$', '') }}/compose/BaseOS/x86_64/images/rhel-guest-image-{{ compose_id | regex_replace('^RHEL-', '') }}.x86_64.qcow2"
guest_image_filename: rhel10-2-base.qcow2
guest_image_path: "{{ kvm_base_dir }}/{{ guest_image_filename }}"
vm_disk_size: auto                     # preferred OS disk, reduced to free space if needed
vm_disk_preferred_gib: 150
vm_disk_reserve_gib: 32                # keep this much free on the image filesystem
vm_disk_path: "{{ kvm_base_dir }}/{{ vm_name }}.qcow2"

# --- Cloud-init ---
cloud_init_dir: "{{ kvm_base_dir }}/cloud-init"
cloud_init_iso: "{{ kvm_base_dir }}/{{ vm_name }}-cidata.iso"

# --- Networking ---
vm_network: default
vm_bridge: ""                   # leave empty to use NAT default network

# --- Yum repos inside the guest (from the same compose as the qcow2) ---
vm_repos:
  - name: "rhel-{{ compose_major }}-baseos"
    description: "RHEL {{ compose_release }} BaseOS"
    baseurl: "{{ compose_url | regex_replace('/+$', '') }}/compose/BaseOS/x86_64/os/"
  - name: "rhel-{{ compose_major }}-appstream"
    description: "RHEL {{ compose_release }} AppStream"
    baseurl: "{{ compose_url | regex_replace('/+$', '') }}/compose/AppStream/x86_64/os/"
  - name: "rhel-{{ compose_major }}-crb"
    description: "RHEL {{ compose_release }} CRB"
    baseurl: "{{ compose_url | regex_replace('/+$', '') }}/compose/CRB/x86_64/os/"
  - name: "rhel-{{ compose_major }}-sap"
    description: "RHEL {{ compose_release }} SAP"
    baseurl: "{{ compose_url | regex_replace('/+$', '') }}/compose/SAP/x86_64/os/"
  - name: "rhel-{{ compose_major }}-saphana"
    description: "RHEL {{ compose_release }} SAPHANA"
    baseurl: "{{ compose_url | regex_replace('/+$', '') }}/compose/SAPHANA/x86_64/os/"

# Guest packages for verification and SAP HCMT
vm_packages:
  - numactl
  - numactl-libs
  - util-linux
  - procps-ng
  - iproute
  - pciutils
  - dmidecode
  - sysstat
  - ethtool
  - hwloc
  - libaio
  - libatomic
  - libxcrypt-compat
  - unzip
  - tar
  - gzip
  - wget
  - curl
  - bind-utils
  - net-tools
  - nfs-utils
  - sg3_utils
  - smartmontools
  - fio
  - iperf3
  - chrony
  - tuned
  - xfsprogs
  - rsync
  - which
  - hostname
  - openssl
  - uuidd
  - lshw

# --- Feature flags ---
download_guest_image: false     # set true to fetch guest_image_url from compose_url
guest_image_download_timeout: 3600
destroy_existing_vm: false      # set true to tear down existing VM first

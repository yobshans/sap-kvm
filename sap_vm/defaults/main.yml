---
# ============================================================================
# KVM HANA VM — Role Defaults
# ============================================================================

# --- VM identity ---
vm_name: sap-kvm-vm
vm_hostname: sap-kvm-vm
vm_domain: lab.eng.tlv2.redhat.com
vm_fqdn: "{{ vm_hostname }}.{{ vm_domain }}"
# Root password is not stored in git. Required at runtime:
#   ansible-playbook ... -e vm_root_password='...'
# Non-interactive SSH into the guest (never prompt for a password)
vm_ssh_opts: >-
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
  -o PreferredAuthentications=password
  -o PubkeyAuthentication=no
  -o NumberOfPasswordPrompts=1
  -o ConnectTimeout=10
# Interactive ssh on the hypervisor (strict checking). Recreates replace host keys.
guest_known_hosts_file: /root/.ssh/known_hosts

# --- Guest topology ---
# Set any of these to a concrete value to override discovery.
# "auto" derives layout from the hypervisor (SAP HANA on KVM best practices):
#   sockets = host NUMA nodes
#   cores   = host cores/node minus 1 (first core reserved for emulator/iothread)
#   threads = host SMT
#   memory  = host NUMA memory minus hypervisor reserve, 1 GiB aligned
vm_vcpus: auto
vm_memory_mib: auto
vm_sockets: auto
vm_cores_per_socket: auto
vm_threads_per_core: auto
vm_numa_nodes: auto
vm_numa_memory_mib: auto
vm_cpu_features:
  - rdtscp
  - invtsc
  - x2apic

# --- Host → guest mapping ---
host_reserve_first_core: true
hypervisor_reserve_gib: 100            # PDF rule of thumb; scaled down on small hosts
hypervisor_reserve_min_gib_per_node: 2
vm_memory_min_gib: 64                  # HCMT/HANA floor when auto-sizing

# --- IO threads / emulator pinning (auto from reserved host cores) ---
vm_iothreads: 1
vm_emulatorpin: auto
vm_iothreadpin: auto

# TSC frequency (Hz). auto = host TSC (required when the CPU has no TSC scaling)
vm_tsc_frequency: auto

# --- Hugepages (prefer 1 GiB; discovery falls back to 2 MiB if unavailable) ---
hugepages_size_kb: 1048576
hugepages_per_node: auto
hugepage_nodes: auto

# --- RHEL compose (image + install-time repos come from guest_image_compose_url;
#     compose_url is the "current" compose used to refresh repos and dnf
#     update the guest after it's up) ---
#
# guest_image_compose_url must point at the directory that directly contains
# the Variant directories (BaseOS/AppStream/CRB/SAP/SAPHANA) AND still ships
# BaseOS/x86_64/images/ -- i.e. a GA/base compose, not a "-updates-*" compose
# (those refresh repos but do not rebuild the guest image, see below). The
# qcow2 (guest_image_url) and the guest's first-boot cloud-init yum repos
# (vm_repos) both come from here so the installed guest always matches the
# image it was booted from.
#   TLV lab:    .../RHEL-10.2-20260507.1/compose            (compose has its own subdir)
#   Scale lab:  http://mirror.scalelab.redhat.com/RHEL10/10.2  (no compose/ subdir)
# Override with -e guest_image_compose_url='http://mirror.scalelab.redhat.com/RHEL10/10.2'
guest_image_compose_url: "http://download.eng.tlv.redhat.com/rhel-10/composes/RHEL-10/RHEL-10.2-20260507.1/compose"

# compose_url is the compose the guest's yum repos get repointed at *after*
# first boot (tasks/repo_update.yml), followed by `dnf update`, so the guest
# picks up newer packages/errata without re-baking a new guest image. This
# can safely be a "-updates-*" compose (it only needs Variant/os/ repodata,
# not BaseOS/x86_64/images/). Defaults to the same directory shape as
# guest_image_compose_url; override independently when you want the guest to
# track a newer compose than the one it was installed from.
# Override with -e compose_url='http://mirror.scalelab.redhat.com/RHEL10/10.2'
compose_url: "http://download.eng.tlv.redhat.com/rhel-10/composes/RHEL-10/RHEL-10.2-updates-20260928.d.0/compose"

# Release used for guest yum repo names/descriptions. Kept independent of
# compose_url since not every lab's URL encodes the release the same way.
compose_release: "10.2"
compose_major: "{{ compose_release.split('.') | first }}"

# --- Storage ---
kvm_base_dir: /home/kvm
# Used only when no existing pool already has this target path (this host has pool "kvm")
libvirt_pool: sap-kvm
# The exact dated compose build id embedded in the qcow2 filename
# (rhel-guest-image-<this>.x86_64.qcow2). NOT always derivable from
# guest_image_compose_url -- e.g. the Scale lab URL only names the release
# stream, not the specific dated build currently mirrored there -- so it is
# its own variable. Keep it paired with guest_image_compose_url (a GA/base
# compose), never with compose_url's "-updates-*" build: "-updates-*"
# composes do not rebuild BaseOS/x86_64/images/, so
# rhel-guest-image-10.2-updates-<date>....qcow2 404s. Override together when
# switching labs/builds:
#   -e guest_image_compose_url='http://mirror.scalelab.redhat.com/RHEL10/10.2' -e guest_image_compose_id='10.2-20260408.1'
guest_image_compose_id: "10.2-20260507.1"
# Remote qcow2 name follows guest_image_compose_id. Local name does not.
guest_image_url: "{{ guest_image_compose_url | regex_replace('/+$', '') }}/BaseOS/x86_64/images/rhel-guest-image-{{ guest_image_compose_id }}.x86_64.qcow2"
guest_image_filename: rhel10-2-base.qcow2
guest_image_path: "{{ kvm_base_dir }}/{{ guest_image_filename }}"
vm_disk_size: auto                     # preferred OS disk, reduced to free space if needed
vm_disk_preferred_gib: 150
vm_disk_reserve_gib: 32                # keep this much free on the image filesystem
vm_disk_path: "{{ kvm_base_dir }}/{{ vm_name }}.qcow2"

# --- Cloud-init ---
cloud_init_dir: "{{ kvm_base_dir }}/cloud-init"
cloud_init_iso: "{{ kvm_base_dir }}/{{ vm_name }}-cidata.iso"

# --- Networking ---
vm_network: default
vm_bridge: ""                   # leave empty to use NAT default network

# --- Yum repos inside the guest ---
# First-boot (cloud-init, templates/user-data.j2) repos: same GA/base compose
# as the qcow2, so the packages cloud-init installs on first boot are
# guaranteed to exist. skip_if_unavailable (set in templates/user-data.j2)
# means a lab that does not mirror SAP/SAPHANA just skips those two instead
# of failing the boot.
vm_repos:
  - name: "rhel-{{ compose_major }}-baseos"
    description: "RHEL {{ compose_release }} BaseOS"
    baseurl: "{{ guest_image_compose_url | regex_replace('/+$', '') }}/BaseOS/x86_64/os/"
  - name: "rhel-{{ compose_major }}-appstream"
    description: "RHEL {{ compose_release }} AppStream"
    baseurl: "{{ guest_image_compose_url | regex_replace('/+$', '') }}/AppStream/x86_64/os/"
  - name: "rhel-{{ compose_major }}-crb"
    description: "RHEL {{ compose_release }} CRB"
    baseurl: "{{ guest_image_compose_url | regex_replace('/+$', '') }}/CRB/x86_64/os/"
  - name: "rhel-{{ compose_major }}-sap"
    description: "RHEL {{ compose_release }} SAP"
    baseurl: "{{ guest_image_compose_url | regex_replace('/+$', '') }}/SAP/x86_64/os/"
  - name: "rhel-{{ compose_major }}-saphana"
    description: "RHEL {{ compose_release }} SAPHANA"
    baseurl: "{{ guest_image_compose_url | regex_replace('/+$', '') }}/SAPHANA/x86_64/os/"

# Post-boot (tasks/repo_update.yml) repos: same repo `name`s as vm_repos
# above (so the update overwrites the install-time repo files in place)
# but pointed at compose_url -- typically a newer "-updates-*" compose --
# so `dnf update` on the guest picks up newer packages/errata.
vm_update_repos:
  - name: "rhel-{{ compose_major }}-baseos"
    description: "RHEL {{ compose_release }} BaseOS (update)"
    baseurl: "{{ compose_url | regex_replace('/+$', '') }}/BaseOS/x86_64/os/"
  - name: "rhel-{{ compose_major }}-appstream"
    description: "RHEL {{ compose_release }} AppStream (update)"
    baseurl: "{{ compose_url | regex_replace('/+$', '') }}/AppStream/x86_64/os/"
  - name: "rhel-{{ compose_major }}-crb"
    description: "RHEL {{ compose_release }} CRB (update)"
    baseurl: "{{ compose_url | regex_replace('/+$', '') }}/CRB/x86_64/os/"
  - name: "rhel-{{ compose_major }}-sap"
    description: "RHEL {{ compose_release }} SAP (update)"
    baseurl: "{{ compose_url | regex_replace('/+$', '') }}/SAP/x86_64/os/"
  - name: "rhel-{{ compose_major }}-saphana"
    description: "RHEL {{ compose_release }} SAPHANA (update)"
    baseurl: "{{ compose_url | regex_replace('/+$', '') }}/SAPHANA/x86_64/os/"

# Guest packages for verification and SAP HCMT
vm_packages:
  - numactl
  - numactl-libs
  - util-linux
  - procps-ng
  - iproute
  - pciutils
  - dmidecode
  - sysstat
  - ethtool
  - hwloc
  - libaio
  - libatomic
  - libxcrypt-compat
  - unzip
  - tar
  - gzip
  - wget
  - curl
  - bind-utils
  - net-tools
  - nfs-utils
  - sg3_utils
  - smartmontools
  - fio
  - iperf3
  - chrony
  - tuned
  - xfsprogs
  - rsync
  - which
  - hostname
  - openssl
  - uuidd
  - lshw

# --- Feature flags ---
download_guest_image: false     # set true to fetch guest_image_url from guest_image_compose_url
guest_image_download_timeout: 3600
destroy_existing_vm: false      # set true to tear down existing VM first

# cloud-init installs vm_packages from 5 real yum repos on first boot; on a
# slow mirror this comfortably exceeds a couple of minutes.
cloud_init_boot_timeout: 1800

# After first boot, repoint the guest's yum repos at compose_url
# (tasks/repo_update.yml's vm_update_repos) and run `dnf update` so it picks
# up newer packages/errata without re-baking a new guest image. Set to
# false to leave the guest pinned to guest_image_compose_url's packages.
guest_update_packages: true
# dnf update on 5 real repos can run long depending on how much has drifted
# since guest_image_compose_url; polled via async so the play doesn't block
# the whole ansible-playbook run's normal task timeout handling.
guest_dnf_update_async: 3600
guest_dnf_update_poll: 15
